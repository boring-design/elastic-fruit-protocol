name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Lint
        run: buf lint
      - name: Breaking change check against main
        if: github.ref != 'refs/heads/main'
        run: buf breaking --against 'https://github.com/boring-design/elastic-fruit-protocol.git#branch=main'
      - name: Generated code is up to date
        run: |
          buf generate
          git diff --exit-code
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
